<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Open Antarctica — Ferrar Glacier</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>

  <header class="topbar">
    <div>
      <div class="brand">Open Antarctica</div>
      <div class="place">Ferrar Glacier · local 3D prototype</div>
    </div>
    <div id="status" class="status">Loading terrain…</div>
  </header>

  <aside class="panel">
    <label>
      <span>Vertical exaggeration</span>
      <div class="row">
        <input id="exaggeration" type="range" min="0.5" max="5" step="0.1" value="1">
        <output id="exaggerationValue">1.0×</output>
      </div>
    </label>

    <label class="check"><input id="textureToggle" type="checkbox" checked> LIMA imagery</label>
    <label class="check"><input id="wireframeToggle" type="checkbox"> Wireframe</label>

    <button id="resetView" type="button">Reset view</button>

    <div class="meta" id="meta"></div>
    <div class="provenance">
      Terrain: PGC REMA v2<br>
      Imagery: USGS LIMA 15 m<br>
      Source CRS: EPSG:3031
    </div>
  </aside>

  <div class="hint">Drag to orbit · wheel to zoom · right-drag to pan</div>

  <script type="module" src="./main-lod.js"></script>
</body>
</html>
